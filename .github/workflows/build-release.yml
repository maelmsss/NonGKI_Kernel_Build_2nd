name: Build and Release Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      build-kernel:
        description: 'Build Kernel ?'
        required: true
        type: boolean
        default: true

      build-target:
        description: 'Which workflow'
        required: true
        type: choice
        default: both
        options:
          - both
          - series
          - note10plus

      release-kernel:
        description: 'Release Kernel ?'
        required: true
        type: boolean
        default: true

  schedule:
    - cron: '0 3 * * 3'

jobs:
  build-series:
    name: "S10 / Note10 series"
    uses: ./.github/workflows/build-samsung-note10-oneui-a15.yml
    secrets: inherit
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build-kernel == true && (inputs.build-target == 'both' || inputs.build-target == 'series'))

  build-note10plus:
    name: "Note10+ only"
    uses: ./.github/workflows/build-samsung-note10plus-oneui-a15.yml
    secrets: inherit
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build-kernel == true && (inputs.build-target == 'both' || inputs.build-target == 'note10plus'))

  release-kernel:
    name: "Step Release Kernel"
    runs-on: ubuntu-24.04
    needs:
      - build-series
      - build-note10plus
    if: |
      always() &&
      (needs.build-series.result == 'success' || needs.build-note10plus.result == 'success') &&
      needs.build-series.result != 'failure' &&
      needs.build-note10plus.result != 'failure' &&
      (github.event_name == 'schedule' || inputs.release-kernel == true)
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: "Exynos 982x"
      RELEASE_NOTES: |
        Exynos 9820 / 9825, OneUI A15, BakaSU `sync-up`, SUSFS. Pick the zip by codename.

        | Device Name | Codename | Kernel | System | Android | Method | KernelSU | SUSFS | Re:Kernel | BBG | NoMount |
        |----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|----------|
        | Samsung Galaxy S10e | beyond0lte | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |
        | Samsung Galaxy S10 | beyond1lte | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |
        | Samsung Galaxy S10+ | beyond2lte | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |
        | Samsung Galaxy S10 5G | beyondx | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |
        | Samsung Galaxy S10 5G Korea | beyondxks | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |
        | Samsung Galaxy Note10 | d1 | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |
        | Samsung Galaxy Note10 Korea | d1xks | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |
        | Samsung Galaxy Note10+ | d2s | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |
        | Samsung Galaxy Note10+ 5G | d2x | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |
        | Samsung Galaxy Note10+ 5G Korea | d2xks | 4.14 | OneUI A15 | 15 | AnyKernel3 | BakaSU | ✅ | ❌ | ✅ | ✅ |

        - KernelSU version below is the manager version number, not the git commit.
        - `series` builds every row. `note10plus` builds only d2s from build-samsung-note10plus-oneui-a15.yml. `both` uploads two d2s zips; the timestamps differ.

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          merge-multiple: true
          skip-decompress: true

      - name: Generate and Create New Tag
        run: |
          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0000000001"
          fi

          NEW_TAG=$(date +%s)

          echo "New tag: $NEW_TAG"

          TIME=$(date +"%Y-%m-%d %H:%M")
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV

          git tag $NEW_TAG
          git push --tags

          git clone -b sync-up https://github.com/Baka-SU/BakaSU.git KernelSU-BakaSU
          KSU_BAKASU_VERSION=$(cd KernelSU-BakaSU && expr $(/usr/bin/git rev-list --count HEAD) + 30000 + 700)

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES" >> $GITHUB_ENV
          echo "[KernelSU-BakaSU](https://github.com/Baka-SU/BakaSU/tree/sync-up) Version: $KSU_BAKASU_VERSION  " >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: false
          release_name: "${{ env.RELEASE_NAME }} ${{ env.TIME }}"
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets Dynamically
        run: |
          for file in ./downloaded-artifacts/*; do
              if [ -d "$file" ]; then
                  continue
              fi

              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
          done

      - name: Display Files Uploaded
        run: |
          echo "GitHub release created with the following files:"
          ls ./downloaded-artifacts/*
