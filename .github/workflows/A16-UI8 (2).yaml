      - name: ➕ Add Non-GKI configs and Optimize
        shell: bash
        run: |
            cd $GITHUB_WORKSPACE/device_kernel
            DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
            
            # 1. Add base configs
            cat >> "$DEFCONFIG_FILE" << 'EOF'
            
            CONFIG_SCHED_BORE=y
            
            EOF
            
            # 2. Disable heavy debuggers and clean logs
            sed -i \
              -e 's/CONFIG_SLUB_DEBUG=y/# CONFIG_SLUB_DEBUG is not set/g' \
              -e 's/CONFIG_SEC_NAD=y/# CONFIG_SEC_NAD is not set/g' \
              -e 's/CONFIG_EXYNOS_CORESIGHT=y/# CONFIG_EXYNOS_CORESIGHT is not set/g' \
              -e 's/CONFIG_DEBUG_INFO=y/# CONFIG_DEBUG_INFO is not set/g' \
              -e 's/CONFIG_SCHED_DEBUG=y/# CONFIG_SCHED_DEBUG is not set/g' \
              -e 's/CONFIG_SCHED_INFO=y/# CONFIG_SCHED_INFO is not set/g' \
              -e 's/CONFIG_SCHEDSTATS=y/# CONFIG_SCHEDSTATS is not set/g' \
              -e 's/CONFIG_MALI_DEBUG_SYS=y/# CONFIG_MALI_DEBUG_SYS is not set/g' \
              -e 's/CONFIG_MALI_EXYNOS_DEBUG=y/# CONFIG_MALI_EXYNOS_DEBUG is not set/g' \
              -e 's/CONFIG_ION_DEBUG_EVENT_RECORD=y/# CONFIG_ION_DEBUG_EVENT_RECORD is not set/g' \
              -e 's/CONFIG_MMC_DW_DEBUG=y/# CONFIG_MMC_DW_DEBUG is not set/g' \
              -e 's/CONFIG_PAGE_POISONING=y/# CONFIG_PAGE_POISONING is not set/g' \
              "$DEFCONFIG_FILE"
              
            # 3. Spoof Uname
            sed -i '/CONFIG_KSU_SUSFS_SPOOF_UNAME/d' "$DEFCONFIG_FILE"
            echo "# CONFIG_KSU_SUSFS_SPOOF_UNAME is not set" >> "$DEFCONFIG_FILE"
            echo "[+] Patching debug-snapshot.h to fix bcmdhd unused function error..."
            
            
            # 4. Optimizing RAM (Virtual Memory & zRAM)
            echo "[+] Optimizing RAM (Virtual Memory & zRAM)..."
            find mm -name "vmscan.c" -exec sed -i 's/int vm_vfs_cache_pressure = 100;/int vm_vfs_cache_pressure = 50;/g' {} +
            find mm -name "swap.c" -exec sed -i 's/int page_cluster;/int page_cluster = 0;/g' {} +
            
            # 5. blk-mq and MQ-Deadline setup (Fixing Kyber panic)
            echo "[*] Enabling SCSI Multi-Queue (blk-mq)..."
            sed -i '/CONFIG_SCSI_MQ_DEFAULT/d' "$DEFCONFIG_FILE"
            echo "CONFIG_SCSI_MQ_DEFAULT=y" >> "$DEFCONFIG_FILE"

