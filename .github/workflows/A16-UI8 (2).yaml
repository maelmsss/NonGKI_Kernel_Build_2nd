name: Build Samsung Note 10 Plus (OneUI A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_note_10plus"
  DEVICE_CODENAME : "d2s"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/maelmsss/exynos982x_kernel.git"
  KERNEL_BRANCH : "main"

  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""


  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "exynos9820_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk , next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true
  
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oneui_a15"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "samsung_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "note10_plus_exyons9850" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "false" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KERNEL_PATCH: "false" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "false" # Anyone devices. 
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "true" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "true" # Merge config files.
  MERGE_CONFIG_FILES: "d2s.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Samsung Note 10 Plus (OneUI A15)
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      KBUILD_BUILD_TIMESTAMP: "Thu Mar 2 09:32:04 KST 2023"
      KBUILD_BUILD_USER: "builder"
      KBUILD_BUILD_HOST: "buildhost"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛡️ Backup Patches Directory
        shell: bash
        run: |
          echo "[*] Backing up Patches directory to /tmp/Patches_Backup..."
          cp -r $GITHUB_WORKSPACE/Patches /tmp/Patches_Backup
          echo "[+] Backup complete. Contents of /tmp/Patches_Backup:"
          ls -la /tmp/Patches_Backup
      # ========================================

      - name: 🔍 List Patches directory
        shell: bash
        run: |
          ls -la $GITHUB_WORKSPACE/Patches/ || echo "[-] Patches not found in Workspace (already backed up)"
          echo "---"
          find /tmp/Patches_Backup -maxdepth 2 -type f

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready
          
      - name: ⚙️ Custom Scheduler Optimizations (Hardcoded & Locked)
        shell: bash
        run: |
            cd $GITHUB_WORKSPACE/device_kernel

            echo "[*] Processing Kconfig settings..."
            find arch/arm64/configs -type f -name "*defconfig" -exec sh -c '
                
                # (Network Scheduler)
                echo "CONFIG_NET_SCHED=y" >> "{}"
                echo "CONFIG_NET_SCH_FQ_CODEL=y" >> "{}"
                echo "CONFIG_DEFAULT_FQ_CODEL=y" >> "{}"
                echo "CONFIG_NET_SCH_DEFAULT=y" >> "{}"
                sed -i "/CONFIG_DEFAULT_NET_SCH/d" "{}"
                echo "CONFIG_DEFAULT_NET_SCH=\"fq_codel\"" >> "{}"

                # (Congestion Control)
                echo "CONFIG_TCP_CONG_ADVANCED=y" >> "{}"
                echo "CONFIG_TCP_CONG_CUBIC=y" >> "{}"
                echo "CONFIG_DEFAULT_CUBIC=y" >> "{}"
                sed -i "/CONFIG_DEFAULT_TCP_CONG/d" "{}"
                echo "CONFIG_DEFAULT_TCP_CONG=\"cubic\"" >> "{}"
            ' \;

            echo "[*] Hardcoding fq_codel into source..."
            # 1. Replace pfifo_fast with fq_codel in source code
            sed -i 's/"pfifo_fast"/"fq_codel"/g' net/sched/sch_generic.c

            echo "[+] Optimizations locked into kernel successfully!"

      - name: 🛠️ Apply Fatalcoder Optimizations
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # GitHub Raw bağlantı adresi
          BASE_URL="https://raw.githubusercontent.com/fatalcoder524/kernel_patches_additional/main/other_opt"
          
          # Uygulanacak yamaların listesi
          PATCHES=(
            "silence_irq_cpu_logspam.patch"
            "reduce_pci_pme_wakeups.patch"
            "increase_sk_mem_packets.patch"
            "increase_ext4_default_commit_age.patch"
            "f2fs_enlarge_min_fsync_blocks.patch"
            "disable_cache_hot_buddy.patch"
            "adjust_cpu_scan_order.patch"
          )
          
          echo "[+] Downloading and applying extreme optimization patches..."
          
          for PATCH_FILE in "${PATCHES[@]}"; do
            echo "------------------------------------------------"
            echo "[*] Processing: $PATCH_FILE"
            
            # Yamayı indir
            wget -qO "$PATCH_FILE" "$BASE_URL/$PATCH_FILE"
            
            # Yamayı toleransla uygula, çakışırsa sistemi çökertmeden diğerine geç
            patch -p1 --fuzz=3 < "$PATCH_FILE"
          done
          
          echo "------------------------------------------------"
          echo "[+] All optimization patches processed successfully!"

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🕵️ Integrate VPNHide Next (Legacy Android 4.14) & UDP GSO TX
        shell: bash
        env:
          PATCH_SCRIPT_1: |
            import re, sys
            from pathlib import Path
            
            k = Path(".")
            
            # --- 1) hook_socket.c: 4.18 guard'ını kaldır, gso_size yazma ---
            hook = k / "security/vpnhide/hook_socket.c"
            if not hook.exists():
                sys.exit("missing security/vpnhide/hook_socket.c — apply.sh failed")
            t = hook.read_text()
            if "level == SOL_UDP" in t and "KERNEL_VERSION(4, 18, 0)" in t:
                repl1 = (
                    "#ifndef SOL_UDP\n"
                    "#define SOL_UDP 17\n"
                    "#endif\n"
                    "#ifndef UDP_SEGMENT\n"
                    "#define UDP_SEGMENT 103\n"
                    "#endif\n"
                    "\telse if (level == SOL_UDP) {\n"
                    "\t\tif (optname == UDP_SEGMENT) {\n"
                    "\t\t\tif (sk->sk_protocol != IPPROTO_UDP ||\n"
                    "\t\t\t    sk->sk_type != SOCK_DGRAM ||\n"
                    "\t\t\t    optlen != sizeof(int))\n"
                    "\t\t\t\treturn 0;\n"
                    "\t\t\tsk->sk_mark |= VH_SK_PROBE_MARK;\n"
                    "\t\t\trecord_kmod_intercept(uid, HOOK_SETSOCKOPT);\n"
                    "\t\t\treturn 1;\n"
                    "\t\t}\n"
                    "\t}"
                )
                t2, n = re.subn(
                    r"#if LINUX_VERSION_CODE >= KERNEL_VERSION\(4,\s*18,\s*0\)\s*"
                    r"else if \(level == SOL_UDP\) \{.*?\n#endif",
                    repl1, t, count=1, flags=re.S
                )
                if n != 1:
                    sys.exit("UDP_SEGMENT #if block not matched in hook_socket.c")
                hook.write_text(t2)
                print("[+] hook_socket.c: UDP_SEGMENT spoof enabled for 4.14")
            else:
                print("[=] hook_socket.c already without 4.18 UDP_SEGMENT guard")
            
            # --- 2) udp.c stub: ENOPROTOOPT yerine success (Undeclared Bypass) ---
            udp_c = k / "net/ipv4/udp.c"
            c = udp_c.read_text()
            
            def inject_cases(src, fn, set_not_get):
                m = re.search(rf"\n[^\n]*\b{fn}\s*\(", src)
                if not m:
                    print(f"[!] {fn} not found")
                    return src
                start = m.start()
                body = src[start:start+9000]
                if "case UDP_SEGMENT:" in body:
                    print(f"[=] {fn}: UDP_SEGMENT already present")
                    return src
                
                # Derleyici uapi udp.h'ı görmezden geldiği için makroları DOĞRUDAN switch içine gömüyoruz
                if set_not_get:
                    block = (
                        "\n#ifndef UDP_SEGMENT\n"
                        "#define UDP_SEGMENT 103\n"
                        "#endif\n"
                        "#ifndef UDP_GRO\n"
                        "#define UDP_GRO 104\n"
                        "#endif\n"
                        "\tcase UDP_SEGMENT:\n"
                        "\t\tif (val < 0 || val > 0xFFFF)\n"
                        "\t\t\treturn -EINVAL;\n"
                        "\t\tbreak;\n"
                        "\tcase UDP_GRO:\n"
                        "\t\tbreak;"
                    )
                else:
                    block = (
                        "\n#ifndef UDP_SEGMENT\n"
                        "#define UDP_SEGMENT 103\n"
                        "#endif\n"
                        "#ifndef UDP_GRO\n"
                        "#define UDP_GRO 104\n"
                        "#endif\n"
                        "\tcase UDP_SEGMENT:\n"
                        "\t\tval = 0;\n"
                        "\t\tbreak;\n"
                        "\tcase UDP_GRO:\n"
                        "\t\tval = 0;\n"
                        "\t\tbreak;"
                    )
                    
                body2, n = re.subn(r"(\n\tdefault:\n\t\terr = -ENOPROTOOPT;)", block + r"\1", body, count=1)
                if n != 1:
                    body2, n = re.subn(r"(\n\tdefault:\n\t\treturn -ENOPROTOOPT;)", block + r"\1", body, count=1)
                if n != 1:
                    print(f"[!] {fn}: default ENOPROTOOPT not found, skip")
                    return src
                print(f"[+] {fn}: stubbed UDP_SEGMENT")
                return src[:start] + body2 + src[start+9000:]
            
            c = inject_cases(c, "udp_lib_setsockopt", True)
            c = inject_cases(c, "udp_lib_getsockopt", False)
            udp_c.write_text(c)
            
            # --- 3) setsockopt hook insert kaçtıysa net/socket.c'ye bas ---
            sock_c = k / "net/socket.c"
            s = sock_c.read_text()
            if "vpnhide_setsockopt_sock" in s:
                print("[=] net/socket.c already has vpnhide_setsockopt_sock")
            else:
                needle = "\tif (sock != NULL) {"
                m = re.search(r"SYSCALL_DEFINE5\(\s*(?:SYSC_)?setsockopt\b.*?\)\s*\{", s, re.S)
                if not m:
                    m = re.search(r"\nSYSCALL_DEFINE5\(setsockopt,", s)
                if not m:
                    sys.exit("setsockopt syscall not found in net/socket.c")
                fn_start = m.start()
                window = s[fn_start:fn_start+2500]
                insert = (
                    "\n#ifdef CONFIG_VPNHIDE\n"
                    "\t\t{\n"
                    "\t\t\tint _vret = vpnhide_setsockopt_sock(sock, level, optname, optval, optlen);\n"
                    "\t\t\tif (_vret) {\n"
                    "\t\t\t\terr = (_vret > 0) ? 0 : _vret;\n"
                    "\t\t\t\tgoto out_put;\n"
                    "\t\t\t}\n"
                    "\t\t}\n"
                    "#endif\n"
                )
                if needle in window:
                    window2 = window.replace(needle, needle + insert, 1)
                elif "if (!sock)" in window or "if (sock ==" in window:
                    window2, n = re.subn(
                        r"(if\s*\(\s*!sock[^\)]*\)\s*\{?\s*return\s+-EBADF;\s*\}?)",
                        r"\1" + insert,
                        window,
                        count=1,
                    )
                    if n != 1:
                        sys.exit("could not find sock lookup in setsockopt")
                else:
                    sys.exit("could not find insert point in setsockopt")
                sock_c.write_text(s[:fn_start] + window2 + s[fn_start+2500:])
                print("[+] net/socket.c: injected vpnhide_setsockopt_sock")
            
            # --- 4) TCP_MAXSEG ve TCP_INFO MSS Spoof (VPN Tespiti Atlama) ---
            tcp_c_path = k / "net/ipv4/tcp.c"
            if tcp_c_path.exists():
                tcpc = tcp_c_path.read_text()
                
                # TCP_MAXSEG spoof
                m_get = re.search(r"\nint do_tcp_getsockopt\(.*?\n\{", tcpc)
                if m_get:
                    start_get = m_get.start()
                    body = tcpc[start_get:start_get+8000]
                    if "VPNHide TCP_MAXSEG spoof" not in body:
                        body2, n = re.subn(
                            r"(case TCP_MAXSEG:.*?)(\n\s*break;)",
                            r"\1\n\t\t/* VPNHide TCP_MAXSEG spoof */\n\t\tif (val > 0 && val < 1400) val = 1460;\2",
                            body,
                            count=1,
                            flags=re.S
                        )
                        if n == 1:
                            tcpc = tcpc[:start_get] + body2 + tcpc[start_get+8000:]
                            print("[+] tcp.c: TCP_MAXSEG spoof injected")
                        else:
                            print("[!] tcp.c: Failed to inject TCP_MAXSEG spoof")

                # TCP_INFO spoof
                if "VPNHide TCP_INFO spoof" not in tcpc:
                    tcpc, n = re.subn(
                        r"(info->tcpi_rcv_mss\s*=\s*[^;]+;)",
                        r"\1\n\t/* VPNHide TCP_INFO spoof */\n\tif (info->tcpi_snd_mss > 0 && info->tcpi_snd_mss < 1400) info->tcpi_snd_mss = 1460;\n\tif (info->tcpi_rcv_mss > 0 && info->tcpi_rcv_mss < 1400) info->tcpi_rcv_mss = 1460;",
                        tcpc,
                        count=1
                    )
                    if n == 1:
                        print("[+] tcp.c: TCP_INFO spoof injected")
                    else:
                        print("[!] tcp.c: Failed to inject TCP_INFO spoof")

                tcp_c_path.write_text(tcpc)
            
            print("[+] VPNHide Fingerprint fixes done")

          PATCH_SCRIPT_2: |
            import re, sys
            from pathlib import Path
            
            k = Path(".")
            
            def must(p):
                p = Path(p)
                if not p.exists():
                    sys.exit(f"missing {p}")
                return p
            
            def sub_once(path, pat, repl, flags=0, label=""):
                p = must(path)
                t = p.read_text()
                t2, n = re.subn(pat, repl, t, count=1, flags=flags)
                if n != 1:
                    sys.exit(f"patch failed: {path} ({label or pat[:60]!r})")
                p.write_text(t2)
                print(f"[+] {path}: {label}")
            
            def append_to_struct_safe(struct_name, field_code, candidate_files):
                for path in candidate_files:
                    p = Path(path)
                    if not p.exists(): continue
                    t = p.read_text()
                    t_mask = re.sub(r'/\*.*?\*/|//[^\n]*', lambda m: ' ' * len(m.group(0)), t, flags=re.S)
                    m = re.search(r"\bstruct\s+" + struct_name + r"\s*\{", t_mask)
                    if m:
                        if field_code.strip() in t:
                            print(f"[=] {path}: {struct_name} already patched")
                            return
                        braces = 1
                        idx = m.end()
                        while idx < len(t_mask) and braces > 0:
                            if t_mask[idx] == '{': braces += 1
                            elif t_mask[idx] == '}': braces -= 1
                            idx += 1
                        if braces != 0:
                            sys.exit(f"patch failed: {path} (brace mismatch in {struct_name})")
                        idx -= 1
                        t2 = t[:idx] + field_code + "\n" + t[idx:]
                        p.write_text(t2)
                        print(f"[+] {path}: {struct_name} modified")
                        return
                sys.exit(f"patch failed: struct {struct_name} not found in {candidate_files}")
            
            skbuff = must("include/linux/skbuff.h").read_text()
            if "SKB_GSO_UDP_L4" in skbuff and "gso_size" in must("net/ipv4/udp.c").read_text():
                print("[=] UDP GSO TX already present, skip")
                sys.exit(0)
            
            # 64-Bit Feature limitine takilmamak icin standart SCTP ozelliginin bitini alias (maske) olarak kullaniyoruz.
            if "SKB_GSO_UDP_L4" not in skbuff:
                sub_once(
                    "include/linux/skbuff.h",
                    r"(SKB_GSO_ESP\s*=\s*1\s*<<\s*\d+,)",
                    r"\1\n\tSKB_GSO_UDP_L4 = SKB_GSO_SCTP,",
                    label="SKB_GSO_UDP_L4 alias"
                )
            
            nf = must("include/linux/netdev_features.h").read_text()
            if "NETIF_F_GSO_UDP_L4" not in nf:
                sub_once(
                    "include/linux/netdev_features.h",
                    r"(#define NETIF_F_GSO_ESP\s+.*\n)",
                    r"\1#define NETIF_F_GSO_UDP_L4\tNETIF_F_GSO_SCTP\n",
                    label="NETIF_F_GSO_UDP_L4 define"
                )
            
            # Structlara gso_size ekleme
            append_to_struct_safe("udp_sock", "\t__u16 gso_size;", ["include/linux/udp.h", "include/net/udp.h"])
            append_to_struct_safe("inet_cork", "\t__u16 gso_size;", ["include/net/inet_sock.h"])
            
            udp = must("net/ipv4/udp.c").read_text()
            if "up->gso_size" not in udp:
                if "case UDP_SEGMENT:" in udp:
                    sub_once(
                        "net/ipv4/udp.c",
                        r"case UDP_SEGMENT:\s*if \(val < 0 \|\| val > 0xFFFF\)\s*return -EINVAL;\s*break;",
                        (
                            "case UDP_SEGMENT:\n"
                            "\t\tif (val < 0 || val > 0xFFFF)\n"
                            "\t\t\treturn -EINVAL;\n"
                            "\t\tup->gso_size = val;\n"
                            "\t\tbreak;"
                        ),
                        label="UDP_SEGMENT stores gso_size",
                    )
                if (
                    "case UDP_SEGMENT:" in Path("net/ipv4/udp.c").read_text() and 
                    "val = up->gso_size" not in Path("net/ipv4/udp.c").read_text()
                ):
                    sub_once(
                        "net/ipv4/udp.c",
                        r"(case UDP_SEGMENT:\s*val = 0;\s*break;)",
                        "case UDP_SEGMENT:\n\t\tval = up->gso_size;\n\t\tbreak;",
                        label="getsockopt gso_size",
                    )
            
                send_repl = (
                    r"\1"
                    "\tif (udp_sk(sk)->gso_size) {\n"
                    "\t\tunsigned int mss = udp_sk(sk)->gso_size;\n"
                    "\t\tunsigned int hlen = skb_network_header_len(skb) + sizeof(*uh);\n"
                    "\t\tif (hlen + mss > 0xFFFF)\n"
                    "\t\t\treturn -EINVAL;\n"
                    "\t\tif (skb->len > mss * 64)\n"
                    "\t\t\treturn -EINVAL;\n"
                    "\t\tif (skb->ip_summed != CHECKSUM_PARTIAL || is_udplite)\n"
                    "\t\t\treturn -EIO;\n"
                    "\t\tskb_shinfo(skb)->gso_size = mss;\n"
                    "\t\tskb_shinfo(skb)->gso_type = SKB_GSO_UDP_L4;\n"
                    "\t\tskb_shinfo(skb)->gso_segs = DIV_ROUND_UP(skb->len - hlen, mss);\n"
                    "\t}\n\n"
                    "send:"
                )
            
                sub_once(
                    "net/ipv4/udp.c",
                    r"(static int udp_send_skb\([\s\S]*?uh->check = CSUM_MANGLED_0;\s*)send:",
                    send_repl,
                    label="udp_send_skb GSO",
                )
            
            off = must("net/ipv4/udp_offload.c").read_text()
            if "__udp_gso_segment" not in off:
                helper = (
                    "\n"
                    "struct sk_buff *__udp_gso_segment(struct sk_buff *gso_skb,\n"
                    "\t\t\t\t  netdev_features_t features)\n"
                    "{\n"
                    "\tstruct sk_buff *segs, *seg;\n"
                    "\tstruct udphdr *uh = udp_hdr(gso_skb);\n"
                    "\tunsigned int mss = skb_shinfo(gso_skb)->gso_size;\n\n"
                    "\tif (gso_skb->len <= sizeof(*uh) + mss)\n"
                    "\t\treturn ERR_PTR(-EINVAL);\n\n"
                    "\tsegs = skb_segment(gso_skb, features);\n"
                    "\tif (IS_ERR_OR_NULL(segs))\n"
                    "\t\treturn segs;\n\n"
                    "\tfor (seg = segs; seg; seg = seg->next) {\n"
                    "\t\tuh = udp_hdr(seg);\n"
                    "\t\tuh->len = htons(seg->len - skb_transport_offset(seg));\n"
                    "\t\tif (seg->ip_summed == CHECKSUM_PARTIAL) {\n"
                    "\t\t\tuh->check = 0;\n"
                    "\t\t\tseg->csum_start = skb_transport_header(seg) - seg->head;\n"
                    "\t\t\tseg->csum_offset = offsetof(struct udphdr, check);\n"
                    "\t\t}\n"
                    "\t}\n"
                    "\treturn segs;\n"
                    "}\n\n"
                    r"\1"
                )
            
                sub_once(
                    "net/ipv4/udp_offload.c",
                    r"(static struct sk_buff \*udp4_ufo_fragment\()",
                    helper,
                    label="insert __udp_gso_segment",
                )
            
                off2 = Path("net/ipv4/udp_offload.c").read_text()
                if "SKB_GSO_UDP_L4" not in off2.split("udp4_ufo_fragment")[1][:800]:
                    sub_once(
                        "net/ipv4/udp_offload.c",
                        r"if \(!\(skb_shinfo\(skb\)->gso_type & SKB_GSO_UDP\)\)",
                        "if (!(skb_shinfo(skb)->gso_type & (SKB_GSO_UDP | SKB_GSO_UDP_L4)))",
                        label="ufo_fragment accept UDP_L4",
                    )
                    
                    branch_repl = (
                        r"\1"
                        "\tif (skb_shinfo(skb)->gso_type & SKB_GSO_UDP_L4)\n"
                        "\t\treturn __udp_gso_segment(skb, features);\n\n"
                    )
                    
                    sub_once(
                        "net/ipv4/udp_offload.c",
                        r"(if \(!pskb_may_pull\(skb, sizeof\(struct udphdr\)\)\)\s*goto out;\s*)",
                        branch_repl,
                        label="branch to __udp_gso_segment",
                    )
            
            print("[+] software UDP GSO TX patched")

        run: |
          set -x
          cd $GITHUB_WORKSPACE/device_kernel
          
          echo "[+] VPNHide Next backend repo..."
          rm -rf /tmp/vpnhide_next_backend
          git clone --depth=1 https://github.com/soranerai/vpnhide_next_backend.git /tmp/vpnhide_next_backend
          
          echo "[+] Fixing Exynos variable names in inject_legacy.py..."
          sed -i 's/rt6i_dst/fib6_dst/g' /tmp/vpnhide_next_backend/kpatch/scripts/inject_legacy.py
          sed -i 's/rt->dst.dev/rt->fib6_nh.nh_dev/g' /tmp/vpnhide_next_backend/kpatch/scripts/inject_legacy.py
          
          echo "[+] Running apply.sh..."
          chmod +x /tmp/vpnhide_next_backend/kpatch/scripts/apply.sh
          /tmp/vpnhide_next_backend/kpatch/scripts/apply.sh "$GITHUB_WORKSPACE/device_kernel" upstream-4.14
          
          echo "[+] 4.14 UDP_SEGMENT fingerprint fix..."
          python3 -c "$PATCH_SCRIPT_1"
          
          echo "[+] Software UDP GSO TX (4.14 backport)..."
          python3 -c "$PATCH_SCRIPT_2"
          
          echo "[+] Updating defconfig..."
          DEFCONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          sed -i '/CONFIG_VPNHIDE/d' "$DEFCONFIG_FILE"
          echo "CONFIG_VPNHIDE=y" >> "$DEFCONFIG_FILE"
          
          echo "[+] VPNHide Next & UDP GSO TX integrated successfully."
    
