name: Build Samsung Note 10 Plus (OneUI A15)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "samsung_note_10plus"
  DEVICE_CODENAME : "d2s"

  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  EXTRA_CMDS : "LLVM=1 LLVM_IAS=1"

  KERNEL_SOURCE : "https://github.com/maelmsss/exynos982x_kernel.git"
  KERNEL_BRANCH : "main"

  CLANG_SOURCE : "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz"
  CLANG_BRANCH : ""

  GCC_GNU : false
  GCC_64_SOURCE : ""
  GCC_64_BRANCH : ""
  GCC_32_SOURCE : ""
  GCC_32_BRANCH : ""


  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "exynos9820_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "resukisu" # xxksu, rsuntk , next, resukisu and sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true
  
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "oneui_a15"

  # Other env
  PYTHON_VERSION: "3" # Only 2(Ubuntu 22.04 and Ubuntu 20.04) or 3(Any OS Versions).

  PACK_METHOD: "AnyKernel3" # Anykernel3 need SOURCE and BRANCH, MKBOOTIMG needn't it.
  PACK_KMODULES: "false" # if u want pack kernel modules (.ko) into Anykernel3.

  KERNELSU_METHOD: "shell" # shell, manual and only.

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches" # [your_name]/[your_patch] -> gooder123/NonGKI_Patcher
  PATCHES_BRANCH: "samsung_kernel" # [your_branch] -> main

  SUSFS_FOLDER_FIXED: "note10_plus_exyons9850" # Fill in your patch prefix directory here. Leave it blank if there isn't one. -> your_folder
  SUSFS_PATCH_FIXED: "susfs_fixed" # Fill in your patches here. If there are multiple patches, please separate them with a comma. Leave it blank if there isn't one. -> patch1,patch2

  REKERNEL_ENABLE: "false" # if u need Re:Kernel.
  DROIDSPACES_ENABLE: "false" # if u need Droidspaces or LXC/Docker.
  NOMOUNT_ENABLE: "false" # if u need NoMount.

  HOOK_METHOD: "syscall" # Manual hook method ->  syscall.

  KERNEL_PATCH: "false" # If your kernel version is <= 4.9, you have the option of enabling the patch to patch the kernel_write and kernel_read functions.

  KPM_ENABLE: "false" # Anyone devices. 
  KPM_INLINE: "false" # Only use it for SukiSU-Ultra.
  KPM_KPATCH_NEXT: "false" # If u want hook KPatch-Next in build step.
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/patch_linux" # If u want to use KPM Inline,so you need set patch exec file source -> raw.githubusercontent.com/Test/Test/patch .

  BASEBAND_GUARD_ENABLE: "true" #if u want prevent unauthorized writes to critical partitions/device nodes.
  BASEBAND_GUARD_BOOT: "false" #if u want to protect boot partition.

  GENERATE_DTB: "false" # if u kernel need DTB , but cannot auto generate it. (Only Anykernel3).
  GENERATE_CHIP: "qcom" # only supported for qcom and mediatek.

  BUILD_DEBUGGER: "false" # Output build errors.
  SKIP_PATCH: "false" # Ignore errors found in Patch Debugger.

  BUILD_OTHER_CONFIG: "true" # Merge config files.
  MERGE_CONFIG_FILES: "d2s.config"

  FREE_MORE_SPACE: "false" # if u want get more space, enabled it.

jobs:
  build-kernel:
    name: Samsung Note 10 Plus (OneUI A15)
    runs-on: ubuntu-latest # u can changed to ubuntu 22.04, and need container set ubuntu-latest
    # container: archlinux/archlinux:latest # if u need use arch linux -> archlinux/archlinux:latest or ubuntu 20.04 -> ubuntu:focal
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      KBUILD_BUILD_TIMESTAMP: "Thu Mar 2 09:32:04 KST 2023"
      KBUILD_BUILD_USER: "builder"
      KBUILD_BUILD_HOST: "buildhost"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🛡️ Backup Patches Directory
        shell: bash
        run: |
          echo "[*] Backing up Patches directory to /tmp/Patches_Backup..."
          cp -r $GITHUB_WORKSPACE/Patches /tmp/Patches_Backup
          echo "[+] Backup complete. Contents of /tmp/Patches_Backup:"
          ls -la /tmp/Patches_Backup
      # ========================================

      - name: 🔍 List Patches directory
        shell: bash
        run: |
          ls -la $GITHUB_WORKSPACE/Patches/ || echo "[-] Patches not found in Workspace (already backed up)"
          echo "---"
          find /tmp/Patches_Backup -maxdepth 2 -type f

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready
          
      - name: ⚙️ Custom Scheduler Optimizations (Hardcoded & Locked)
        shell: bash
        run: |
            cd $GITHUB_WORKSPACE/device_kernel

            echo "[*] Processing Kconfig settings..."
            find arch/arm64/configs -type f -name "*defconfig" -exec sh -c '
                
                # (Network Scheduler)
                echo "CONFIG_NET_SCHED=y" >> "{}"
                echo "CONFIG_NET_SCH_FQ_CODEL=y" >> "{}"
                echo "CONFIG_DEFAULT_FQ_CODEL=y" >> "{}"
                echo "CONFIG_NET_SCH_DEFAULT=y" >> "{}"
                sed -i "/CONFIG_DEFAULT_NET_SCH/d" "{}"
                echo "CONFIG_DEFAULT_NET_SCH=\"fq_codel\"" >> "{}"

                # (Congestion Control)
                echo "CONFIG_TCP_CONG_ADVANCED=y" >> "{}"
                echo "CONFIG_TCP_CONG_CUBIC=y" >> "{}"
                echo "CONFIG_DEFAULT_CUBIC=y" >> "{}"
                sed -i "/CONFIG_DEFAULT_TCP_CONG/d" "{}"
                echo "CONFIG_DEFAULT_TCP_CONG=\"cubic\"" >> "{}"
            ' \;

            echo "[*] Hardcoding fq_codel into source..."
            # 1. Replace pfifo_fast with fq_codel in source code
            sed -i 's/"pfifo_fast"/"fq_codel"/g' net/sched/sch_generic.c

            echo "[+] Optimizations locked into kernel successfully!"

      - name: 🛠️ Apply Fatalcoder Optimizations
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          
          # GitHub Raw bağlantı adresi
          BASE_URL="https://raw.githubusercontent.com/fatalcoder524/kernel_patches_additional/main/other_opt"
          
          # Uygulanacak yamaların listesi
          PATCHES=(
            "silence_irq_cpu_logspam.patch"
            "reduce_pci_pme_wakeups.patch"
            "increase_sk_mem_packets.patch"
            "increase_ext4_default_commit_age.patch"
            "f2fs_enlarge_min_fsync_blocks.patch"
            "disable_cache_hot_buddy.patch"
            "adjust_cpu_scan_order.patch"
          )
          
          echo "[+] Downloading and applying extreme optimization patches..."
          
          for PATCH_FILE in "${PATCHES[@]}"; do
            echo "------------------------------------------------"
            echo "[*] Processing: $PATCH_FILE"
            
            # Yamayı indir
            wget -qO "$PATCH_FILE" "$BASE_URL/$PATCH_FILE"
            
            # Yamayı toleransla uygula, çakışırsa sistemi çökertmeden diğerine geç
            patch -p1 --fuzz=3 < "$PATCH_FILE"
          done
          
          echo "------------------------------------------------"
          echo "[+] All optimization patches processed successfully!"

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: Apply VPNHide kpatch + UDP_SEGMENT backport
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          # 1) UDP_SEGMENT / UDP GSO sockopt backport (4.14)
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Idempotent UDP_SEGMENT (UDP GSO) backport for Linux 4.14.
          
          Mirrors upstream:
            bec1f6f69736 udp: generate gso with UDP_SEGMENT
            2e8de8576343 udp: add gso segment cmsg
          plus the software checksum fallback so TUN does not return -EIO.
          """
          from __future__ import annotations
          
          import re
          import sys
          from pathlib import Path
          
          ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else ".").resolve()
          
          
          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  sys.exit(f"FAIL missing {rel}")
              return p.read_text(encoding="utf-8", errors="surrogateescape")
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding="utf-8", errors="surrogateescape")
          
          
          def sub(rel: str, pattern: str, repl: str, *, already: str, flags: int = 0) -> None:
              text = read(rel)
              if already in text:
                  print(f"skip {rel}: already applied ({already[:60]})")
                  return
              new, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  sys.exit(f"FAIL {rel}: expected 1 match, got {n} for {pattern[:120]!r}")
              write(rel, new)
              print(f"ok   {rel}")
          
          
          GSO_IPV4 = r'''	if (cork->gso_size) {
          		const int hlen = skb_network_header_len(skb) +
          				 sizeof(struct udphdr);
          
          		if (hlen + min(datalen, (int)cork->gso_size) > cork->fragsize) {
          			kfree_skb(skb);
          			return -EMSGSIZE;
          		}
          		if (skb->len > cork->gso_size * UDP_MAX_SEGMENTS) {
          			kfree_skb(skb);
          			return -EINVAL;
          		}
          		if (sk->sk_no_check_tx || is_udplite || dst_xfrm(skb_dst(skb))) {
          			kfree_skb(skb);
          			return -EIO;
          		}
          		if (datalen > cork->gso_size) {
          			skb_shinfo(skb)->gso_size = cork->gso_size;
          			skb_shinfo(skb)->gso_type = SKB_GSO_UDP_L4;
          			skb_shinfo(skb)->gso_segs = DIV_ROUND_UP(datalen,
          								 cork->gso_size);
          		}
          		if (skb->ip_summed == CHECKSUM_PARTIAL)
          			goto csum_partial;
          		goto send;
          	}
          
          '''
          
          GSO_IPV6 = r'''	if (cork->gso_size) {
          		const int hlen = skb_network_header_len(skb) +
          				 sizeof(struct udphdr);
          
          		if (hlen + min(datalen, (int)cork->gso_size) > cork->fragsize) {
          			kfree_skb(skb);
          			return -EMSGSIZE;
          		}
          		if (skb->len > cork->gso_size * UDP_MAX_SEGMENTS) {
          			kfree_skb(skb);
          			return -EINVAL;
          		}
          		if (udp_sk(sk)->no_check6_tx || is_udplite ||
          		    dst_xfrm(skb_dst(skb))) {
          			kfree_skb(skb);
          			return -EIO;
          		}
          		if (datalen > cork->gso_size) {
          			skb_shinfo(skb)->gso_size = cork->gso_size;
          			skb_shinfo(skb)->gso_type = SKB_GSO_UDP_L4;
          			skb_shinfo(skb)->gso_segs = DIV_ROUND_UP(datalen,
          								 cork->gso_size);
          		}
          		if (skb->ip_summed == CHECKSUM_PARTIAL)
          			goto csum_partial;
          		goto send;
          	}
          
          '''
          
          CMSG = r'''static int __udp_cmsg_send(struct cmsghdr *cmsg, u16 *gso_size)
          {
          	switch (cmsg->cmsg_type) {
          	case UDP_SEGMENT:
          		if (cmsg->cmsg_len != CMSG_LEN(sizeof(__u16)))
          			return -EINVAL;
          		*gso_size = *(__u16 *)CMSG_DATA(cmsg);
          		return 0;
          	default:
          		return -EINVAL;
          	}
          }
          
          int udp_cmsg_send(struct sock *sk, struct msghdr *msg, u16 *gso_size)
          {
          	struct cmsghdr *cmsg;
          	bool need_ip = false;
          	int err;
          
          	for_each_cmsghdr(cmsg, msg) {
          		if (!CMSG_OK(msg, cmsg))
          			return -EINVAL;
          
          		if (cmsg->cmsg_level != SOL_UDP) {
          			need_ip = true;
          			continue;
          		}
          
          		err = __udp_cmsg_send(cmsg, gso_size);
          		if (err)
          			return err;
          	}
          
          	return need_ip;
          }
          EXPORT_SYMBOL_GPL(udp_cmsg_send);
          
          '''
          
          
          def main() -> None:
              sub(
                  "include/uapi/linux/udp.h",
                  r"(#define UDP_NO_CHECK6_RX\s+102[^\n]*\n)",
                  r"\1#define UDP_SEGMENT	103	/* Set GSO segmentation size */\n",
                  already="#define UDP_SEGMENT",
              )
              sub(
                  "include/linux/udp.h",
                  r"(__u16\s+len;\s*/\*[^\n]*pending frames[^\n]*\*/\n)",
                  r"\1	__u16		 gso_size;	/* UDP GSO segment size (UDP_SEGMENT) */\n",
                  already="gso_size;",
              )
              sub(
                  "include/net/inet_sock.h",
                  r"(char\s+priority;\n)(\};\n\nstruct inet_cork_full)",
                  r"\1	__u16			gso_size;\n\2",
                  already="gso_size;",
              )
              sub(
                  "include/net/ip.h",
                  r"(char\s+priority;\n)(\};\n\n#define IPCB\(skb\))",
                  r"\1	__u16			gso_size;\n\2",
                  already="gso_size;",
              )
              sub(
                  "include/net/ipv6.h",
                  r"(__s8\s+dontfrag;\n)(\tstruct ipv6_txoptions \*opt;)",
                  r"\1	__u16 gso_size;\n\2",
                  already="gso_size;",
              )
              sub(
                  "include/net/udp.h",
                  r"(unsigned int mss, __sum16 check\);\n)",
                  r"\1\n#define UDP_MAX_SEGMENTS	(1 << 6U)\n"
                  r"int udp_cmsg_send(struct sock *sk, struct msghdr *msg, u16 *gso_size);\n",
                  already="udp_cmsg_send(",
              )
              sub(
                  "include/linux/netdev_features.h",
                  r"(NETIF_F_GSO_UDP_BIT,\s*/\* \.\.\. UFO, deprecated except tuntap \*/\n)"
                  r"(\s*/\*\*/NETIF_F_GSO_LAST =\s*/\* last bit, see GSO_MASK \*/\n)"
                  r"(\s*NETIF_F_GSO_UDP_BIT,)",
                  r"\1	NETIF_F_GSO_UDP_L4_BIT,		/* ... UDP payload GSO (not UFO) */\n"
                  r"\2		NETIF_F_GSO_UDP_L4_BIT,",
                  already="NETIF_F_GSO_UDP_L4_BIT",
              )
              sub(
                  "include/linux/netdev_features.h",
                  r"(#define NETIF_F_GSO_UDP\s+__NETIF_F\(GSO_UDP\)\n)",
                  r"\1#define NETIF_F_GSO_UDP_L4	__NETIF_F(GSO_UDP_L4)\n",
                  already="#define NETIF_F_GSO_UDP_L4",
              )
              sub(
                  "include/linux/netdev_features.h",
                  r"(#define NETIF_F_GSO_SOFTWARE\s+\(NETIF_F_ALL_TSO \| \\\n\s+NETIF_F_GSO_SCTP\))",
                  r"\1				 NETIF_F_GSO_SCTP | NETIF_F_GSO_UDP_L4)",
                  already="NETIF_F_GSO_UDP_L4)",
              )
              sub(
                  "include/linux/netdevice.h",
                  r"(BUILD_BUG_ON\(SKB_GSO_UDP != \(NETIF_F_GSO_UDP >> NETIF_F_GSO_SHIFT\)\);\n)",
                  r"\1	BUILD_BUG_ON(SKB_GSO_UDP_L4 != (NETIF_F_GSO_UDP_L4 >> NETIF_F_GSO_SHIFT));\n",
                  already="SKB_GSO_UDP_L4 != (NETIF_F_GSO_UDP_L4",
              )
              sub(
                  "net/ipv4/ip_output.c",
                  r"(cork->tx_flags = ipc->tx_flags;\n)(\n\treturn 0;)",
                  r"\1	cork->gso_size = ipc->gso_size;\n\2",
                  already="cork->gso_size = ipc->gso_size",
              )
              sub(
                  "net/ipv6/ip6_output.c",
                  r"(cork->base.length = 0;\n)(\n\treturn 0;)",
                  r"\1	cork->base.gso_size = ipc6->gso_size;\n\2",
                  already="cork->base.gso_size = ipc6->gso_size",
              )
          
              # ipv4 udp_send_skb
              sub(
                  "net/ipv4/udp.c",
                  r"static int udp_send_skb\(struct sk_buff \*skb, struct flowi4 \*fl4\)\n",
                  "static int udp_send_skb(struct sk_buff *skb, struct flowi4 *fl4,\n"
                  "			struct inet_cork *cork)\n",
                  already="struct inet_cork *cork)",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"(int len = skb->len - offset;\n)(\t__wsum csum = 0;)",
                  r"\1	int datalen = len - sizeof(*uh);\n\2",
                  already="int datalen = len - sizeof(*uh);",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"(uh->len = htons\(len\);\n\tuh->check = 0;\n\n)(\tif \(is_udplite\))",
                  r"\1" + GSO_IPV4 + r"\2",
                  already="if (cork->gso_size)",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"(else if \(skb->ip_summed == CHECKSUM_PARTIAL\) \{ /\* UDP hardware csum \*/\n\n)"
                  r"(\t\tudp4_hwcsum\(skb, fl4->saddr, fl4->daddr\);)",
                  r"\1csum_partial:\n\n\2",
                  already="\ncsum_partial:\n",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"err = udp_send_skb\(skb, fl4\);",
                  "err = udp_send_skb(skb, fl4, &inet->cork.base);",
                  already="udp_send_skb(skb, fl4, &inet->cork.base)",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"(EXPORT_SYMBOL\(udp_push_pending_frames\);\n\n)(int udp_sendmsg\()",
                  r"\1" + CMSG + r"\2",
                  already="int udp_cmsg_send(struct sock *sk, struct msghdr *msg, u16 *gso_size)",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"(ipc.tos = -1;\n)",
                  r"\1	ipc.gso_size = up->gso_size;\n",
                  already="ipc.gso_size = up->gso_size",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"err = ip_cmsg_send\(sk, msg, &ipc, sk->sk_family == AF_INET6\);\n"
                  r"\t\tif \(unlikely\(err\)\) \{",
                  "err = udp_cmsg_send(sk, msg, &ipc.gso_size);\n"
                  "		if (err > 0)\n"
                  "			err = ip_cmsg_send(sk, msg, &ipc,\n"
                  "					   sk->sk_family == AF_INET6);\n"
                  "		if (unlikely(err < 0)) {",
                  already="udp_cmsg_send(sk, msg, &ipc.gso_size)",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"(if \(!corkreq\) \{\n)"
                  r"(\t\tskb = ip_make_skb\(sk, fl4, getfrag, msg, ulen,\n"
                  r"\t\t\t\t  sizeof\(struct udphdr\), &ipc, &rt,\n"
                  r"\t\t\t\t  msg->msg_flags\);\n"
                  r"\t\terr = PTR_ERR\(skb\);\n"
                  r"\t\tif \(!IS_ERR_OR_NULL\(skb\)\)\n"
                  r"\t\t\terr = udp_send_skb\(skb, fl4\);)",
                  r"\1		struct inet_cork cork;\n"
                  r"\n"
                  r"		skb = ip_make_skb(sk, fl4, getfrag, msg, ulen,\n"
                  r"				  sizeof(struct udphdr), &ipc, &rt,\n"
                  r"				  msg->msg_flags);\n"
                  r"		err = PTR_ERR(skb);\n"
                  r"		if (!IS_ERR_OR_NULL(skb)) {\n"
                  r"			cork.gso_size = ipc.gso_size;\n"
                  r"			cork.fragsize = ip_sk_use_pmtu(sk) ?\n"
                  r"				dst_mtu(skb_dst(skb)) :\n"
                  r"				skb_dst(skb)->dev->mtu;\n"
                  r"			err = udp_send_skb(skb, fl4, &cork);\n"
                  r"		}",
                  already="cork.gso_size = ipc.gso_size",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"(case UDP_NO_CHECK6_RX:\n\t\tup->no_check6_rx = valbool;\n\t\tbreak;\n\n)",
                  r"\1	case UDP_SEGMENT:\n"
                  r"		if (val < 0 || val > USHRT_MAX)\n"
                  r"			return -EINVAL;\n"
                  r"		up->gso_size = val;\n"
                  r"		break;\n\n",
                  already="up->gso_size = val",
              )
              sub(
                  "net/ipv4/udp.c",
                  r"(case UDP_NO_CHECK6_RX:\n\t\tval = up->no_check6_rx;\n\t\tbreak;\n\n)",
                  r"\1	case UDP_SEGMENT:\n"
                  r"		val = up->gso_size;\n"
                  r"		break;\n\n",
                  already="val = up->gso_size",
              )
          
              # ipv6
              sub(
                  "net/ipv6/udp.c",
                  r"static int udp_v6_send_skb\(struct sk_buff \*skb, struct flowi6 \*fl6\)\n",
                  "static int udp_v6_send_skb(struct sk_buff *skb, struct flowi6 *fl6,\n"
                  "			   struct inet_cork *cork)\n",
                  already="struct inet_cork *cork)",
              )
              sub(
                  "net/ipv6/udp.c",
                  r"(int offset = skb_transport_offset\(skb\);\n"
                  r"\tint len = skb->len - offset;\n)",
                  r"\1	int datalen = len - sizeof(*uh);\n",
                  already="int datalen = len - sizeof(*uh);",
              )
              sub(
                  "net/ipv6/udp.c",
                  r"(uh->len = htons\(len\);\n\tuh->check = 0;\n\n)(\tif \(is_udplite\)\n\t\tcsum = udplite_csum\(skb\);)",
                  r"\1" + GSO_IPV6 + r"\2",
                  already="if (cork->gso_size)",
              )
              sub(
                  "net/ipv6/udp.c",
                  r"(else if \(skb->ip_summed == CHECKSUM_PARTIAL\) \{ /\* UDP hardware csum \*/\n)"
                  r"(\t\tudp6_hwcsum_outgoing\(sk, skb, &fl6->saddr, &fl6->daddr, len\);)",
                  r"\1csum_partial:\n\2",
                  already="\ncsum_partial:\n",
              )
              sub(
                  "net/ipv6/udp.c",
                  r"err = udp_v6_send_skb\(skb, &fl6\);",
                  "err = udp_v6_send_skb(skb, &fl6, &inet_sk(sk)->cork.base);",
                  already="udp_v6_send_skb(skb, &fl6, &inet_sk(sk)->cork.base)",
              )
              sub(
                  "net/ipv6/udp.c",
                  r"(ipc6.dontfrag = -1;\n)",
                  r"\1	ipc6.gso_size = up->gso_size;\n",
                  already="ipc6.gso_size = up->gso_size",
              )
              sub(
                  "net/ipv6/udp.c",
                  r"err = ip6_datagram_send_ctl\(sock_net\(sk\), sk, msg, &fl6, &ipc6, &sockc\);",
                  "err = udp_cmsg_send(sk, msg, &ipc6.gso_size);\n"
                  "		if (err > 0)\n"
                  "			err = ip6_datagram_send_ctl(sock_net(sk), sk, msg, &fl6,\n"
                  "						    &ipc6, &sockc);",
                  already="udp_cmsg_send(sk, msg, &ipc6.gso_size)",
              )
              sub(
                  "net/ipv6/udp.c",
                  r"(if \(!corkreq\) \{\n\t\tstruct sk_buff \*skb;\n\n)"
                  r"(\t\tskb = ip6_make_skb\(sk, getfrag, msg, ulen,\n"
                  r"\t\t\t\t   sizeof\(struct udphdr\), &ipc6,\n"
                  r"\t\t\t\t   &fl6, \(struct rt6_info \*\)dst,\n"
                  r"\t\t\t\t   msg->msg_flags, &sockc\);\n"
                  r"\t\terr = PTR_ERR\(skb\);\n"
                  r"\t\tif \(!IS_ERR_OR_NULL\(skb\)\)\n"
                  r"\t\t\terr = udp_v6_send_skb\(skb, &fl6\);)",
                  r"\1		struct inet_cork cork;\n"
                  r"\n"
                  r"		skb = ip6_make_skb(sk, getfrag, msg, ulen,\n"
                  r"				   sizeof(struct udphdr), &ipc6,\n"
                  r"				   &fl6, (struct rt6_info *)dst,\n"
                  r"				   msg->msg_flags, &sockc);\n"
                  r"		err = PTR_ERR(skb);\n"
                  r"		if (!IS_ERR_OR_NULL(skb)) {\n"
                  r"			cork.gso_size = ipc6.gso_size;\n"
                  r"			cork.fragsize = dst_mtu(skb_dst(skb));\n"
                  r"			err = udp_v6_send_skb(skb, &fl6, &cork);\n"
                  r"		}",
                  already="cork.gso_size = ipc6.gso_size",
              )
          
              sub(
                  "net/ipv4/udp_offload.c",
                  r"(if \(!can_checksum_protocol\(features, htons\(ETH_P_IP\)\)\)\n)"
                  r"\t\treturn ERR_PTR\(-EIO\);",
                  r"\1		features &= ~(NETIF_F_CSUM_MASK | NETIF_F_GSO_MASK);",
                  already="features &= ~(NETIF_F_CSUM_MASK | NETIF_F_GSO_MASK)",
              )
              sub(
                  "net/ipv6/udp_offload.c",
                  r"(if \(!can_checksum_protocol\(features, htons\(ETH_P_IPV6\)\)\)\n)"
                  r"\t\treturn ERR_PTR\(-EIO\);",
                  r"\1		features &= ~(NETIF_F_CSUM_MASK | NETIF_F_GSO_MASK);",
                  already="features &= ~(NETIF_F_CSUM_MASK | NETIF_F_GSO_MASK)",
              )
          
              leftover4 = re.findall(r"udp_send_skb\([^;]*fl4\);", read("net/ipv4/udp.c"))
              leftover4 = [x for x in leftover4 if ", &" not in x and ", cork" not in x]
              if leftover4:
                  sys.exit(f"FAIL leftover 2-arg udp_send_skb: {leftover4}")
              leftover6 = re.findall(r"udp_v6_send_skb\([^;]*&fl6\);", read("net/ipv6/udp.c"))
              leftover6 = [x for x in leftover6 if ", &" not in x.split("&fl6")[-1]]
              leftover6 = [x for x in leftover6 if x.strip().endswith("&fl6);")]
              if leftover6:
                  sys.exit(f"FAIL leftover 2-arg udp_v6_send_skb: {leftover6}")
          
              print("UDP_SEGMENT 4.14 backport complete")
          
          
          if __name__ == "__main__":
              main()
          PY

          # 2) VPNHide Next in-tree inject (upstream-4.14 profile)
          git clone --depth 1 https://github.com/soranerai/vpnhide_next_backend.git /tmp/vpnhide_next_backend
          sed -i 's/#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 18, 0)/#if defined(UDP_SEGMENT)/' \
            /tmp/vpnhide_next_backend/kpatch/security/vpnhide/hook_socket.c
          bash /tmp/vpnhide_next_backend/kpatch/scripts/apply.sh "$GITHUB_WORKSPACE" upstream-4.14
          grep -q '^CONFIG_VPNHIDE=y' arch/arm64/configs/exynos9820_defconfig \
            || echo 'CONFIG_VPNHIDE=y' >> arch/arm64/configs/exynos9820_defconfig

          grep -q "^#define UDP_SEGMENT" include/uapi/linux/udp.h
          grep -q "CONFIG_VPNHIDE" security/Makefile
          test -f security/vpnhide/core.c

    
