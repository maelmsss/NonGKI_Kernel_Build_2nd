          p = Path("include/linux/netdev_features.h")
          t = p.read_text()
          t2, n = re.subn(
              r"NETIF_F_GSO_SCTP\)\s+NETIF_F_GSO_SCTP\s*\|\s*NETIF_F_GSO_UDP_L4\)",
              "NETIF_F_GSO_SCTP | NETIF_F_GSO_UDP_L4)",
              t,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"NETIF_F_GSO_SOFTWARE fix failed n={n}")
          p.write_text(t2)
          print("fixed NETIF_F_GSO_SOFTWARE")
          PY

          # 2) VPNHide Next in-tree inject (upstream-4.14)
          git clone --depth 1 https://github.com/soranerai/vpnhide_next_backend.git /tmp/vpnhide_next_backend
          python3 - <<'PY'
          from pathlib import Path
          p = Path("/tmp/vpnhide_next_backend/kpatch/scripts/inject_legacy.py")
          t = p.read_text()
          old = 'if ipv6_route_show == "ipv6_route_native_seq_show":'
          if old not in t:
              raise SystemExit("inject_legacy.py: ipv6 if not found")
          t = t.replace(
              old,
              'if ipv6_route_show == "ipv6_route_native_seq_show" or "fib6_dst" in common.read("net/ipv6/ip6_fib.c"):',
              1,
          )
          t = t.replace(
              'ipv6_anchor = "\\tdev = rt->fib6_nh.nh_dev;"',
              'ipv6_anchor = "\\tseq_printf(seq, \\" %08x"',
              1,
          )
          p.write_text(t)
          print("patched inject_legacy.py for Samsung fib6_info")
          PY
          sed -i 's/#if LINUX_VERSION_CODE >= KERNEL_VERSION(4, 18, 0)/#if defined(UDP_SEGMENT)/' \
            /tmp/vpnhide_next_backend/kpatch/security/vpnhide/hook_socket.c
          bash /tmp/vpnhide_next_backend/kpatch/scripts/apply.sh "$GITHUB_WORKSPACE/device_kernel" upstream-4.14
          grep -q '^CONFIG_VPNHIDE=y' arch/arm64/configs/exynos9820_defconfig \
            || echo 'CONFIG_VPNHIDE=y' >> arch/arm64/configs/exynos9820_defconfig

          grep -q '^#define UDP_SEGMENT' include/uapi/linux/udp.h
          grep -q 'CONFIG_VPNHIDE' security/Makefile
          test -f security/vpnhide/core.c
          echo "VPNHide + UDP_SEGMENT ready"

    
